###############################################################################
# webdav/docker-compose.yml : Serveur WebDAV — sauvegardes des terminaux mobiles
# Projet  : kiwinet.me
# Serveur : serveur auto-hébergé x86 (Debian 13)
# Image   : rclone/rclone — sert un dossier local en WebDAV (RFC 4918 partiel)
# Accès   : webdav.kiwinet.me (HTTPS via Traefik uniquement, aucun port publié)
# Usage   : Seedvault (trois profils du Pixel 10a : public, private,
#           professional), Round Sync et Joplin. Un compte unique et un
#           sous-dossier par usage sous /data.
###############################################################################
services:
  # ───────────────────────────────────────────────────────────────────────────
  # WEBDAV : sert /data en WebDAV, authentification bcrypt dédiée
  # (indépendante de l'auth-basic du dashboard Traefik — un client WebDAV
  # comme Seedvault dialogue directement avec rclone, pas avec Traefik)
  # ───────────────────────────────────────────────────────────────────────────
  webdav:
    # Tag + empreinte de l'index multi-architecture (amd64 inclus). À mettre à
    # jour manuellement : rclone publie souvent, y compris des versions de
    # sécurité (1.75.2 du 09/10/2026 corrige une traversée de chemin de
    # `serve webdav`). Empreinte : champ "digest" de
    # https://hub.docker.com/v2/repositories/rclone/rclone/tags/<tag>
    image: rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
    container_name: webdav
    restart: unless-stopped
    # Identifiant du propriétaire du dossier servi sur le serveur (même
    # identifiant que le compte d'administration). Ne pas faire de chown : le
    # volume Data est répliqué vers Proton Drive.
    user: "1000:1000"

    command: >
      serve webdav /data
      --addr :8080
      --baseurl /webdav
      --htpasswd /config/htpasswd
      --realm kiwinet-webdav

    # Durcissement — à valider au démarrage réel (journaux, test client).
    # En cas d'échec, retirer d'abord read_only, puis cap_drop.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

    # Rotation des journaux : le pilote par défaut n'en fait aucune.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      # Fichier d'identifiants bcrypt (ignoré par Git, jamais commité).
      # Générer avec : htpasswd -nB <utilisateur> >> webdav/.htpasswd
      # rclone relit ce fichier à chaud : pas de redémarrage pour le modifier.
      - ./.htpasswd:/config/htpasswd:ro
      # Bind mount explicite (pas de volume nommé) — accès direct depuis l'hôte
      # pour inspection des sauvegardes reçues. Le dossier doit exister avant
      # le démarrage : create_host_path: false évite d'écrire sur le SSD si le
      # disque Data n'est pas monté.
      - type: bind
        source: /mnt/Data/Backups/Technique/grapheneos-backups
        target: /data
        bind:
          create_host_path: false

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webdav.rule=Host(`webdav.kiwinet.me`)"
      - "traefik.http.routers.webdav.entrypoints=websecure"
      - "traefik.http.routers.webdav.tls.certresolver=letsencrypt"
      - "traefik.http.services.webdav.loadbalancer.server.port=8080"
      # secure-headers : durcissement HTTP standard (HSTS, anti-clickjacking, etc.)
      # rate-limit : protection contre le brute-force/abus, vu l'exposition publique
      # Pas d'auth-basic@file ici : rclone gère sa propre authentification WebDAV
      # via --htpasswd ; ajouter une 2e couche créerait un conflit d'auth pour
      # les clients WebDAV qui envoient leurs identifiants directement.
      - "traefik.http.routers.webdav.middlewares=secure-headers@file,rate-limit@file"

# ─────────────────────────────────────────────────────────────────────────────
# RÉSEAUX
# ─────────────────────────────────────────────────────────────────────────────
networks:
  proxy:
    external: true

services:
  icecast:
    image: ghcr.io/libretime/icecast:2.4.4-alpine@sha256:0df551e18fa4e6380ecde7d15abc04610c346fc7cde2b2856581935d1c6ad0d0
    container_name: icecast
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/log/icecast:uid=1000,gid=1000,mode=0750,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /etc/kiwinet/secrets/icecast_config:/etc/icecast.xml:ro
    networks:
      - radio
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  radio:
    name: radio
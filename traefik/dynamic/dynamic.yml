# traefik/dynamic/dynamic.yml : Configuration dynamique Traefik — serveur auto-hébergé
# Rechargée à chaud (watch: true). En cas de doute : docker restart traefik (voir README).

# ─────────────────────────────────────────────────────────────────────────────
# HTTP : Middlewares, routers et services HTTP/HTTPS
# ─────────────────────────────────────────────────────────────────────────────
http:
  middlewares:

    # Protection : dashboard Traefik, Prometheus, Grafana.
    # Identifiants stockés dans .htpasswd (gitignored) — générer avec :
    #   htpasswd -nB <utilisateur> >> .htpasswd   (depuis traefik/)
    auth-basic:
      basicAuth:
        usersFile: /etc/traefik/.htpasswd

    # Headers de sécurité HTTP pour les services exposés publiquement.
    secure-headers:
      headers:
        stsSeconds: 31536000          # HSTS 1 an
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true               # Anti-clickjacking
        contentTypeNosniff: true      # Anti-MIME sniffing
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""            # Masquer la stack technique
          Server: ""
    
    # Variante de secure-headers pour les services qui affichent leurs propres
    # pages dans un cadre (ex. lecteur Kiwix) : seul X-Frame-Options diffère
    # (SAMEORIGIN au lieu de DENY). À réserver à ces services ; garder les deux
    # blocs synchronisés (HSTS, referrerPolicy, etc.).
    secure-headers-sameorigin:
      headers:
        stsSeconds: 31536000          # HSTS 1 an
        stsIncludeSubdomains: true
        stsPreload: true
        customFrameOptionsValue: "SAMEORIGIN"  # cadre autorisé depuis le même site uniquement
        contentTypeNosniff: true      # Anti-MIME sniffing
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""            # Masquer la stack technique
          Server: ""

    # Limitation de débit pour les endpoints publics.
    rate-limit:
      rateLimit:
        average: 100                  # Requêtes/seconde en régime normal
        burst: 50                     # Pic autorisé au-delà de la moyenne

    # Home Assistant : transmet le protocole réel au conteneur
    # Nécessaire pour que HA reconnaisse les connexions HTTPS
    # et génère des URLs correctes (webhooks, Cast, app mobile)
    ha-forwardproto:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"

  routers:

    # Home Assistant : domotique locale exposée via HTTPS.
    # HA tourne en network_mode: host — labels Docker non fonctionnels en mode host,
    # la route est donc déclarée ici manuellement.
    # 172.18.0.1 = passerelle du réseau proxy, fixée dans traefik/docker-compose.yml.
    # Le pare-feu de l'hôte (ufw) doit autoriser 172.18.0.0/16 vers les ports 8123 et 8095.
    homeassistant:
      rule: "Host(`hub.kiwinet.me`)"
      entryPoints:
        - websecure
      service: homeassistant
      tls:
        certResolver: letsencrypt
      middlewares:
        - secure-headers
        - rate-limit
        - ha-forwardproto

    # Music Assistant : interface web exposée en HTTPS.
    # Nécessaire pour que les images (jaquettes) chargées par l'app Companion
    # Android ne soient pas bloquées comme contenu mixte (page HTTPS + image HTTP).
    # MA tourne en network_mode: host — même pattern que Home Assistant.
    music-assistant:
      rule: "Host(`ma.kiwinet.me`)"
      entryPoints:
        - websecure
      service: music-assistant
      tls:
        certResolver: letsencrypt
      middlewares:
        - secure-headers
        - rate-limit

  services:

    # Home Assistant en network_mode: host
    # 172.18.0.1 = gateway réseau proxy = adresse de l'hôte vue depuis Traefik
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:8123"

    # Music Assistant en network_mode: host
    # 172.18.0.1 = gateway réseau proxy = adresse de l'hôte vue depuis Traefik
    music-assistant:
      loadBalancer:
        servers:
          - url: "http://172.18.0.1:8095"

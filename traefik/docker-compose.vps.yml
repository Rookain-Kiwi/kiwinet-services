###############################################################################
# traefik/docker-compose.vps.yml : Reverse Proxy Traefik — VPS Scaleway
# Projet  : kiwinet.me
# Cible   : VPS Scaleway STARDUST1-S (x86_64, fr-par-1)
# Image   : traefik:v3.7.16 épinglé par empreinte (index multi-architecture, linux/amd64)
# SSL     : Let's Encrypt HTTP Challenge (port 80 ouvert, IP datacenter fixe)
###############################################################################

services:

  # ───────────────────────────────────────────────────────────────────────────
  # SOCKET-PROXY : seul conteneur qui touche au socket Docker.
  # Lecture seule de l'API : conteneurs uniquement (CONTAINERS=1), ce qui suffit
  # à Traefik pour découvrir les services. Toute écriture est refusée (POST=0 par
  # défaut). Réseau interne : aucune route vers Internet ni vers le réseau proxy.
  # ───────────────────────────────────────────────────────────────────────────
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: socket-proxy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  # ───────────────────────────────────────────────────────────────────────────
  # TRAEFIK : Point d'entrée unique HTTP/HTTPS du VPS
  # ───────────────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.7.16@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - socket-proxy

    dns:
      - 1.1.1.1   # Cloudflare — résolution DNS depuis le container (requis pour ACME)
      - 8.8.8.8   # Google — fallback

    ports:
      - "80:80"       # HTTP → validation ACME + redirection HTTPS
      - "443:443"     # HTTPS → trafic SSL principal
      - "25565:25565" # TCP → Minecraft Java Edition (passthrough)

    volumes:
      # Plus de socket Docker monté : l'API est lue via socket-proxy (traefik.vps.yml)
      - ./traefik.vps.yml:/etc/traefik/traefik.yml:ro      # Config statique VPS — requiert restart si modifiée
      - ./dynamic.vps.yml:/etc/traefik/dynamic.yml:ro      # Config dynamique VPS — rechargée à chaud
      - ./acme.vps.json:/acme.json                         # Certificats Let's Encrypt VPS (chmod 600, gitignored)

    networks:
      - proxy
      - socket-proxy

    labels:
      # Le dashboard Traefik n'est pas exposé publiquement sur le VPS
      - "traefik.enable=false"

# ─────────────────────────────────────────────────────────────────────────────
# RÉSEAUX
# ─────────────────────────────────────────────────────────────────────────────
networks:
  proxy:
    name: proxy
    driver: bridge
  # socket-proxy : interne, réservé à la lecture de l'API Docker. Sous-réseau fixé
  # (les réseaux sont créés en parallèle : sans plage explicite, Docker pourrait
  # lui attribuer celle de proxy et la création échouerait).
  socket-proxy:
    name: socket-proxy
    internal: true
    ipam:
      config:
        - subnet: 172.31.255.0/29
          gateway: 172.31.255.1

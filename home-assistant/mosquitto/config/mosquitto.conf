###############################################################################
# home-assistant/mosquitto/config/mosquitto.conf
# Broker MQTT local, authentification obligatoire.
# L'exposition réseau est limitée par les ports publiés du compose
# (boucle locale + adresse du réseau local), pas par ce fichier.
###############################################################################

listener 1883
protocol mqtt

# Authentification obligatoire. Le fichier passwd est local (gitignored),
# voir README pour sa création.
# password_file est déprécié depuis la 2.1 (retrait prévu en 3.0) :
# migration vers le plugin password-file à prévoir.
allow_anonymous false
password_file /mosquitto/config/passwd

# Persistance intégrée (dépréciée depuis la 2.1, toujours supportée).
# Ne pas la combiner avec un plugin de persistance (refusé en 2.1.2).
persistence true
persistence_location /mosquitto/data/

# Journaux sur la sortie standard : gérés par Docker, collectés par Promtail.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

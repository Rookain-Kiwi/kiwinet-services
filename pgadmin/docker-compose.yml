services:
  pgadmin:
    # Image officielle PgAdmin 4 — interface web d'administration PostgreSQL
    # Épinglée par empreinte (le tag n'est là que pour la lisibilité) :
    # mise à jour volontaire, jamais automatique
    image: dpage/pgadmin4:9.18@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
    container_name: pgadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      # Compte administrateur PgAdmin — email et mot de passe de connexion à l'interface web
      # L'email reste une variable d'environnement (ce n'est pas un secret). Le mot de passe
      # est lu depuis un secret Docker (fichier hors dépôt, lisible seulement par l'UID 5050
      # de PgAdmin), jamais en variable d'environnement (visible par docker inspect, donc
      # par tout client du proxy de socket).
      # Le démarrage échoue si l'email est absent ou vide, ou si le fichier de secret manque
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?à renseigner dans .env}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_default_password
      # Mode serveur activé — authentification requise à chaque session
      PGADMIN_CONFIG_SERVER_MODE: "True"
      # Sous no-new-privileges, PgAdmin ne peut pas lier le port privilégié 80
      # (repli silencieux sur 8080) : port d'écoute fixé explicitement
      PGADMIN_LISTEN_PORT: "8080"
      # Double authentification obligatoire — application TOTP uniquement
      # (aucun serveur de courrier requis), enrôlement imposé à la première connexion
      PGADMIN_CONFIG_MFA_ENABLED: "True"
      PGADMIN_CONFIG_MFA_SUPPORTED_METHODS: "['authenticator']"
      PGADMIN_CONFIG_MFA_FORCE_REGISTRATION: "True"
    volumes:
      # Volume nommé — persiste la configuration des serveurs enregistrés dans PgAdmin
      - pgadmin-data:/var/lib/pgadmin
    secrets:
      - pgadmin_default_password
    networks:
      # proxy — permet à Traefik de router le trafic HTTPS entrant vers PgAdmin
      # db — permet à PgAdmin d'atteindre le container postgres
      - proxy
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.kiwinet.me`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      # Exposition publique provisoire (jusqu'à la validation de WireGuard) :
      # limitation de débit puis authentification de base, comme le tableau de bord Traefik
      - "traefik.http.routers.pgadmin.middlewares=rate-limit@file,auth-basic@file"
      # Port d'écoute de PgAdmin dans le container (voir PGADMIN_LISTEN_PORT)
      - "traefik.http.services.pgadmin.loadbalancer.server.port=8080"
      # Obligatoire quand le container est sur plusieurs réseaux —
      # indique à Traefik quel réseau utiliser pour joindre PgAdmin
      # Sans cette directive, Traefik choisit un réseau au hasard et échoue
      - "traefik.docker.network=proxy"

volumes:
  # Volume nommé géré par Docker — pas de bind mount, PgAdmin gère ses propres permissions
  pgadmin-data:

networks:
  proxy:
    external: true
  db:
    external: true

secrets:
  pgadmin_default_password:
    # Fichier créé à la main sur le serveur (propriétaire UID 5050, mode 400), absent du dépôt.
    file: /etc/kiwinet/secrets/pgadmin_default_password

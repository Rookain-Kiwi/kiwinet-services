services:
  pihole:
    container_name: pihole
    hostname: pihole
    # Épinglé par tag + empreinte (relevée sur kiwinet-server le 18/10/2026).
    image: pihole/pihole:2026.07.2@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    restart: unless-stopped

    # Même pattern que Home Assistant et Music Assistant : réseau hôte, filtré par ufw
    # (pas de chaîne DOCKER-USER ici, voir Vue d'ensemble du socle).
    network_mode: host

    environment:
      TZ: Europe/Paris

      # Mot de passe admin — jamais en clair ici, sourcé du .env local (non versionné).
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}

      # Port web déplacé pour ne pas entrer en conflit avec Traefik (80/443 déjà pris
      # sur ce même hôte). Lié à l'adresse LAN du serveur, pas à 0.0.0.0.
      # "o" = optionnel au démarrage (ne bloque pas si indisponible).
      FTLCONF_webserver_port: ${PIHOLE_SERVER_IP}:8080o,[::]:8080o

      # Résolveur de la box en primaire (conserve la résolution des noms locaux),
      # résolveur public en secours — même logique que la convention DNS existante.
      FTLCONF_dns_upstreams: ${PIHOLE_DNS_UPSTREAMS}

    volumes:
      - ./etc-pihole:/etc/pihole

    # Pas de cap_drop/no-new-privileges ici, contrairement aux autres services :
    # FTL a besoin du jeu de capacités par défaut de Docker (CHOWN, SETFCAP...)
    # pour s'auto-attribuer les capacités réseau sur son propre binaire au
    # démarrage (écoute du port 53 sans tourner en root permanent). Testé et
    # confirmé en échec avec cap_drop: ALL le 18/10/2026 (voir Décisions).
    # NET_ADMIN non ajouté : nécessaire seulement pour le serveur DHCP de
    # Pi-hole, rôle qui reste à la Freebox.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

###############################################################################
# music-assistant/docker-compose.yml : Music Assistant
# Accès   : https://ma.kiwinet.me (via Traefik, route manuelle dans
#           traefik/dynamic/dynamic.yml) et interface web sur le réseau local
# Prérequis : volume de données restauré AVANT le premier démarrage (voir README)
#
# Image épinglée par empreinte (index multi-architecture, 14/10/2026).
# Procédure de mise à jour : voir README.
###############################################################################
services:
  music-assistant:
    image: ghcr.io/music-assistant/server:2.10.6@sha256:45fdb050e06962097a07feeb092606ad119fac17965c8228a57146448d5fa772
    container_name: music-assistant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # network_mode: host — requis par la doc officielle (découverte et diffusion
    # vers les lecteurs, accès réseau direct). Conséquence : pas de filtrage
    # DOCKER-USER, le service écoute sur toutes les interfaces du serveur et
    # n'est protégé que par ufw.
    network_mode: host
    environment:
      - TZ=Europe/Paris
    volumes:
      - music-assistant-data:/data
      # Musique du disque Libraries, lecture seule : si le disque n'est pas
      # monté, le conteneur refuse de démarrer au lieu d'écrire sur le SSD.
      - type: bind
        source: /mnt/Libraries/Music
        target: /media/music
        read_only: true
        bind:
          create_host_path: false
    # Rotation des journaux : le pilote json-file n'en fait aucune par défaut
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  music-assistant-data:
